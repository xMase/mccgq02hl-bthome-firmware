# On a pushed tag vMAJOR.MINOR.PATCH: fetch the pinned SDK and tools, build the debug, release and
# bootloader images and publish them, with SHA256SUMS, as a GitHub release of that tag.
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the libraries of Simplicity Commander
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgl1 libglib2.0-0t64 libdbus-1-3
      - name: Fetch the SDK and tools
        run: tools/sdk-fetch.sh
      - name: Build the release files
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-files.sh dist "$TAG"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file docs/release-notes.md dist/*
