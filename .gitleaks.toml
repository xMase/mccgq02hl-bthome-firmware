# Gitleaks default rules plus two privacy rules; allowlists need a reason comment each.
[extend]
useDefault = true

# The public repo must not carry the address of a real device. One neutral test MAC is allowed.
[[rules]]
id = "mac-address-literal"
description = "MAC address literal in colon form"
regex = '''(?i)\b(?:[0-9a-f]{2}:){5}[0-9a-f]{2}\b'''
keywords = [":"]
  # Reason: the host tests and check_bthome.py use this neutral address.
  [[rules.allowlists]]
  regexes = ['''(?i)00:11:22:33:44:55''']

# A LAN address in a public file leaks the layout of someone's network.
[[rules]]
id = "private-ipv4-literal"
description = "Private IPv4 address literal (10/8, 172.16/12, 192.168/16)"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
keywords = ["10.", "172.", "192.168"]
